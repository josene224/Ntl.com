<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - NTL, SA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header id="navbar">
    <div class="logo">
      <img src="037EE112-20E2-4B81-8FDD-DDE32F65B220.png" alt="Logo NTL" class="logo-img">
    </div>
    <nav>
      <ul>
        <li><a href="index.html#services">Serviços</a></li>
        <li><a href="index.html#insights">Insights</a></li>
        <li><a href="index.html#contact">Contato</a></li>
        <li><a href="login.html"><i class="fa fa-user"></i></a></li>
      </ul>
    </nav>
  </header>

  <!-- FORMULÁRIO -->
  <main class="login-container">
    <h2>Criar Conta</h2>
    <form id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupSenha" placeholder="Senha" required>
      <button type="submit" class="btn">Criar conta</button>
      <p>Já tem conta? <a href="logina.html">Entrar</a></p>
    </form>
    <p id="signupMensagem" class="mensagem"></p>
  </main>

  <!-- SCRIPT para redirecionamento -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('signupForm');
      form.addEventListener('submit', function(e) {
        e.preventDefault(); // Impede envio tradicional
        // Aqui poderia incluir validações ou salvar dados localmente
        window.location.href = 'indeex.html'; // Redireciona
      });
    });
  </script>

</body>
</html>
